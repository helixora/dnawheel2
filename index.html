<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roda DNA — Kuiz Little Lab</title>
<style>
  :root{
    --purple: #3B1781;
    --purple-light: #6C3CD6;
    --orange: #F4722B;
    --teal: #14B3AC;
    --yellow: #FFC933;
    --cream: #FFF8EC;
    --ink: #241247;
    --good: #2FB56B;
    --bad: #E24C3C;
    --spin-ms: 7200ms;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  html{ overflow-x:hidden; }
  body{
    min-height:100vh;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: #F4F2EE;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 64px;
    overflow-x:hidden;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-bottom: 4px;
    max-width:100%;
  }
  .brand img{
    height: clamp(64px, 9vw, 116px);
    width:auto;
    max-width: min(92vw, 440px);
    object-fit:contain;
    display:block;
  }
  .brand-text h1{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-size: clamp(2rem, 3.6vw, 3.2rem);
    color: var(--purple);
    margin: 4px 0 0;
    line-height:1.1;
    text-align:center;
  }

  .subtitle{
    color: #6B6577;
    font-size: clamp(1.05rem, 1.6vw, 1.4rem);
    text-align:center;
    max-width: 680px;
    margin: 8px 0 34px;
  }

  .stage{
    position:relative;
    width: min(88vw, 680px, max(420px, calc(100vh - 300px)));
    aspect-ratio: 1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pointer{
    position:absolute;
    top: clamp(-22px, -2.6vw, -14px);
    left:50%;
    transform: translateX(-50%);
    width:0; height:0;
    border-left: clamp(16px, 2.6vw, 26px) solid transparent;
    border-right: clamp(16px, 2.6vw, 26px) solid transparent;
    border-top: clamp(26px, 4vw, 40px) solid var(--purple);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.18));
    z-index: 5;
  }

  .wheel-ring{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background: white;
    padding: clamp(8px, 1.6%, 14px);
    box-shadow:
      0 0 0 1px #EAE6DD,
      0 18px 40px rgba(60,40,20,0.14);
  }

  #wheel-svg{
    width:100%;
    height:100%;
    display:block;
    /* Duration is kept in sync with SPIN_DURATION_MS in the script */
    transition: transform var(--spin-ms) cubic-bezier(.13,.83,.19,1);
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 25%;
    aspect-ratio: 1/1;
    border-radius:50%;
    background: radial-gradient(circle at 32% 28%, var(--purple-light), var(--purple) 70%);
    border: clamp(4px, 0.9vw, 7px) solid white;
    box-shadow: 0 6px 14px rgba(0,0,0,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index: 4;
    user-select:none;
  }
  .hub:focus-visible{ outline: 4px solid var(--yellow); outline-offset: 4px; }
  .hub span{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    color: white;
    font-weight: 700;
    font-size: clamp(1rem, 2.7vw, 1.75rem);
    text-align:center;
    letter-spacing:0.03em;
  }
  .hub.spinning{ cursor: not-allowed; opacity:0.9; }
  .hub:active:not(.spinning){ transform: translate(-50%,-50%) scale(0.96); }

  .status{
    margin-top: 30px;
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content:center;
  }
  .chip{
    background: white;
    border: 1px solid #E7E2D8;
    color: #4A4457;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: clamp(0.95rem, 1.3vw, 1.2rem);
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(60,40,20,0.05);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  .chip b{ color: var(--orange); font-weight:800; }
  button.chip{ cursor:pointer; }
  button.chip:hover{ border-color: var(--purple-light); }
  button.chip[aria-pressed="false"]{ color:#9A93A8; }

  .reset-link{
    margin-top: 18px;
    background:none;
    border:none;
    color: #9A93A8;
    font-size: clamp(0.9rem, 1.1vw, 1.05rem);
    text-decoration: underline;
    cursor:pointer;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  .reset-link:hover{ color: var(--purple); }

  @media (min-width: 900px){
    body{ padding: 40px 24px 80px; }
  }

  /* Modal */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(40,32,20,0.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease;
    z-index: 20;
    padding: 0;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  @media (min-width: 640px){
    .overlay{ align-items:center; padding: 16px; }
  }

  .card{
    background: white;
    width: 100%;
    max-width: 880px;
    border-radius: 26px 26px 0 0;
    padding: 26px 20px 28px;
    transform: translateY(30px);
    transition: transform 0.3s ease;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
    max-height: 92vh;
    max-height: 92dvh;
    overflow-y:auto;
    overscroll-behavior: contain;
  }
  @media (min-width: 640px){
    .card{ border-radius: 28px; transform: translateY(10px); padding: 32px 34px 34px; }
  }
  .overlay.show .card{ transform: translateY(0); }

  .card-eyebrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 10px;
  }
  .q-badge{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    background: var(--orange);
    color:white;
    font-weight:700;
    font-size: clamp(0.85rem, 1.1vw, 1.05rem);
    padding: 6px 14px;
    border-radius: 999px;
  }
  .close-x{
    background:none;
    border:none;
    font-size:1.7rem;
    color: #B4AEC0;
    cursor:pointer;
    line-height:1;
    padding: 6px 10px;
  }

  .question{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-size: clamp(1.4rem, 2.5vw, 2.1rem);
    line-height:1.25;
    color: var(--purple);
    margin: 4px 0 22px;
  }

  .options{
    display:grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 760px){
    .options{ grid-template-columns: 1fr 1fr; gap: 16px; }
  }
  .opt{
    display:flex;
    align-items:center;
    gap: 16px;
    text-align:left;
    border: 3px solid #EAE6DD;
    background: #FBFAF8;
    border-radius: 18px;
    padding: 12px 16px 12px 12px;
    min-height: 96px;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(1.1rem, 1.6vw, 1.4rem);
    font-weight: 700;
    line-height:1.25;
    color: var(--ink);
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, opacity .2s ease;
  }
  .opt img{
    flex: 0 0 auto;
    width: clamp(72px, 9vw, 112px);
    height: clamp(72px, 9vw, 112px);
    object-fit: contain;
    display:block;
  }
  .opt .opt-text{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
  .opt:hover:not(:disabled){ border-color: var(--purple-light); }
  .opt:focus-visible{ outline: 3px solid var(--purple-light); outline-offset: 2px; }
  .opt:active:not(:disabled){ transform: scale(0.99); }
  .opt:disabled{ cursor:default; }

  .opt.correct{
    background: #E4F8EE;
    border-color: var(--good);
    color:#1E7A48;
    opacity:1;
  }
  .opt.wrong{
    background: #FCE9E7;
    border-color: var(--bad);
    color:#B33324;
  }
  .opt.dim{ opacity: 0.5; }

  .feedback{
    margin-top: 18px;
    font-weight: 800;
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-size: clamp(1.1rem, 1.7vw, 1.45rem);
    display:flex;
    align-items:center;
    gap: 14px;
    min-height: 1em;
  }
  .feedback:empty{ margin-top:0; }
  .feedback.good{ color:#1E7A48; }
  .feedback.bad{ color:#B33324; }
  .feedback .mark{
    flex:0 0 auto;
    width: 56px; height: 56px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    color:white;
    font-size: 2rem;
    line-height:1;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  .feedback.good .mark{ background: var(--good); }
  .feedback.bad .mark{ background: var(--bad); }

  .next-btn{
    margin-top: 20px;
    width:100%;
    background: var(--purple);
    color: white;
    border:none;
    border-radius: 16px;
    padding: 18px;
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 1.5vw, 1.35rem);
    cursor:pointer;
    display:none;
  }
  .next-btn.show{ display:block; }
  .next-btn:active{ transform: scale(0.99); }

  /* Big ✓ / ✕ verdict */
  .verdict-pop{
    position: fixed;
    top: 50%; left: 50%;
    width: clamp(140px, 22vw, 230px);
    height: clamp(140px, 22vw, 230px);
    margin: calc(clamp(140px, 22vw, 230px) / -2) 0 0 calc(clamp(140px, 22vw, 230px) / -2);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    color: white;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(5.5rem, 13vw, 9rem);
    line-height: 1;
    z-index: 25;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.3);
    box-shadow: 0 0 0 10px rgba(255,255,255,0.85), 0 20px 50px rgba(0,0,0,0.35);
  }
  .verdict-pop.good{ background: var(--good); }
  .verdict-pop.bad{ background: var(--bad); }
  .verdict-pop.good.show{ animation: popIn 1.5s ease forwards; }
  .verdict-pop.bad.show{ animation: popShake 1.5s ease forwards; }
  @keyframes popIn{
    0%{ opacity:0; transform: scale(0.3); }
    16%{ opacity:1; transform: scale(1.15); }
    28%{ transform: scale(1); }
    75%{ opacity:1; transform: scale(1); }
    100%{ opacity:0; transform: scale(0.85); }
  }
  @keyframes popShake{
    0%{ opacity:0; transform: scale(0.3); }
    14%{ opacity:1; transform: scale(1.15); }
    22%{ transform: scale(1) translateX(0); }
    30%{ transform: translateX(-18px) rotate(-6deg); }
    38%{ transform: translateX(16px) rotate(5deg); }
    46%{ transform: translateX(-12px) rotate(-3deg); }
    54%{ transform: translateX(8px) rotate(2deg); }
    62%{ transform: translateX(0) rotate(0); }
    78%{ opacity:1; transform: scale(1); }
    100%{ opacity:0; transform: scale(0.85); }
  }
  @keyframes fadeOnly{
    0%{ opacity:0; } 15%{ opacity:1; } 75%{ opacity:1; } 100%{ opacity:0; }
  }

  .confetti-canvas{
    position: fixed;
    inset: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 26;
  }

  .cycle-banner{
    position: fixed;
    top: 20px; left:50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--yellow);
    color: var(--purple);
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    opacity:0;
    transition: all 0.35s ease;
    z-index: 30;
    pointer-events:none;
    font-size: clamp(0.92rem, 1.3vw, 1.15rem);
    text-align:center;
    max-width: calc(100vw - 32px);
  }
  .cycle-banner.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    .verdict-pop.good.show, .verdict-pop.bad.show{ animation: fadeOnly 1.5s ease forwards; transform:none; }
    .card, .overlay{ transition: none; }
  }
</style>
</head>

/* ============================================================

   ============================================================ */
const PAL = { purple:'#3B1781', purple2:'#6C3CD6', orange:'#F4722B', teal:'#14B3AC', yellow:'#FFC933', red:'#E24C3C', ink:'#241247', muted:'#D9D2E8', muted2:'#B7ADD0' };
const TXT = 'font-family="\'Baloo 2\', ui-rounded, \'Arial Rounded MT Bold\', Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle"';

function frame(inner){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">' +
         '<rect x="1" y="1" width="118" height="118" rx="20" fill="#F6F2FF"/>' + inner + '</svg>';
}
function toURI(svg){ return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }
function f1(n){ return (+n).toFixed(1); }

const ART = {
  helix(){
    let a = '', b = '', rungs = '';
    const rc = [PAL.orange, PAL.teal, PAL.yellow, PAL.purple2];
    for(let y = 14; y <= 106; y += 2){
      const dx = 24 * Math.sin((y - 14) / 92 * Math.PI * 2.5);
      a += (y === 14 ? 'M' : 'L') + f1(60 + dx) + ',' + y + ' ';
      b += (y === 14 ? 'M' : 'L') + f1(60 - dx) + ',' + y + ' ';
    }
    for(let y = 18, i = 0; y <= 102; y += 7, i++){
      const dx = 24 * Math.sin((y - 14) / 92 * Math.PI * 2.5);
      if(Math.abs(dx) > 4) rungs += `<line x1="${f1(60+dx)}" y1="${y}" x2="${f1(60-dx)}" y2="${y}" stroke="${rc[i%4]}" stroke-width="4" stroke-linecap="round"/>`;
    }
    return frame(rungs + `<path d="${a}" fill="none" stroke="${PAL.purple}" stroke-width="6" stroke-linecap="round"/><path d="${b}" fill="none" stroke="${PAL.orange}" stroke-width="6" stroke-linecap="round"/>`);
  },

/* ============================================================
   Sound (Web Audio API — no files, works offline)
   ============================================================ */
let audioCtx = null;
let cheerBuffer = null;
let cheerRendering = null;

function unlockAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(!cheerBuffer && !cheerRendering) cheerRendering = renderCheer().then(b => { cheerBuffer = b; }).catch(() => {});
  }catch(e){}
}

function noiseBuffer(ctx, seconds){
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

// Synthesised crowd cheer: many "yay" voices + crowd roar + claps + a whistle, rendered once.
function renderCheer(){
  const sr = 44100, dur = 2.8;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if(!OAC) return Promise.reject();
  const ctx = new OAC(1, Math.floor(sr * dur), sr);
  const master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  master.connect(comp); comp.connect(ctx.destination);

  // Crowd roar (filtered noise swell)
  const nb = noiseBuffer(ctx, dur);
  const roar = ctx.createBufferSource(); roar.buffer = nb;
  const rf = ctx.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 1100; rf.Q.value = 0.5;
  const rg = ctx.createGain();
  rg.gain.setValueAtTime(0, 0); rg.gain.linearRampToValueAtTime(0.32, 0.25);
  rg.gain.setValueAtTime(0.32, 1.5); rg.gain.exponentialRampToValueAtTime(0.001, dur);
  roar.connect(rf); rf.connect(rg); rg.connect(master); roar.start(0);

  // Voices ("yaaay")
  for(let v = 0; v < 22; v++){
    const t0 = Math.random() * 0.35;
    const len = 0.9 + Math.random() * 0.9;
    const f0 = 190 + Math.random() * 260;
    const osc = ctx.createOscillator(); osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0 * 0.85, t0);
    osc.frequency.exponentialRampToValueAtTime(f0 * 1.18, t0 + 0.28);
    osc.frequency.exponentialRampToValueAtTime(f0 * 0.95, t0 + len);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 5 + Math.random() * 3;
    const lfoG = ctx.createGain(); lfoG.gain.value = f0 * 0.03;
    lfo.connect(lfoG); lfoG.connect(osc.frequency);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.05, t0 + 0.08);
    g.gain.setValueAtTime(0.05, t0 + len * 0.6); g.gain.exponentialRampToValueAtTime(0.0008, t0 + len + 0.5);
    [[750, 6], [1750, 8], [2600, 10]].forEach(([fq, q], k) => {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fq * (0.92 + Math.random() * 0.16); bp.Q.value = q;
      const bg = ctx.createGain(); bg.gain.value = [1.6, 1.0, 0.5][k];
      osc.connect(bp); bp.connect(bg); bg.connect(g);
    });
    g.connect(master);
    osc.start(t0); lfo.start(t0); osc.stop(t0 + len + 0.6); lfo.stop(t0 + len + 0.6);
  }

  // Claps
  for(let c = 0; c < 46; c++){
    const t = 0.15 + Math.random() * 2.2;
    const s = ctx.createBufferSource(); s.buffer = nb;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1300 + Math.random() * 900; bp.Q.value = 1.2;
    const g = ctx.createGain();
    const lvl = 0.25 * (t < 1.6 ? 1 : (2.4 - t) / 0.8);
    g.gain.setValueAtTime(Math.max(lvl, 0.02), t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t, Math.random() * (dur - 0.2), 0.07);
  }

  // Whistle
  const w = ctx.createOscillator(); w.type = 'sine';
  w.frequency.setValueAtTime(1700, 0.35); w.frequency.exponentialRampToValueAtTime(2700, 0.6); w.frequency.exponentialRampToValueAtTime(2300, 0.95);
  const wg = ctx.createGain();
  wg.gain.setValueAtTime(0, 0.35); wg.gain.linearRampToValueAtTime(0.06, 0.42); wg.gain.linearRampToValueAtTime(0.0, 1.0);
  w.connect(wg); wg.connect(master); w.start(0.35); w.stop(1.05);

  return ctx.startRendering();
}

function playCheer(){
  if(!soundOn || !audioCtx) return;
  const go = () => {
    if(!cheerBuffer) return;
    const s = audioCtx.createBufferSource(); s.buffer = cheerBuffer;
    const g = audioCtx.createGain(); g.gain.value = 0.85;
    s.connect(g); g.connect(audioCtx.destination); s.start();
  };
  if(cheerBuffer) go(); else if(cheerRendering) cheerRendering.then(go);
}

function playBuzzer(){
  if(!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime + 0.01;
  const out = audioCtx.createGain(); out.gain.value = 0.22;
  const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  lp.connect(out); out.connect(audioCtx.destination);
  [[0, 0.26], [0.32, 0.5]].forEach(([s, l]) => {
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t + s); g.gain.linearRampToValueAtTime(1, t + s + 0.015);
    g.gain.setValueAtTime(1, t + s + l - 0.04); g.gain.linearRampToValueAtTime(0, t + s + l);
    g.connect(lp);
    [138, 146].forEach(f => {
      const o = audioCtx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t + s);
      o.frequency.linearRampToValueAtTime(f * 0.94, t + s + l);
      o.connect(g); o.start(t + s); o.stop(t + s + l + 0.02);
    });
  });
}

/* ============================================================
   Visual feedback: big ✓ / ✕ and confetti
   ============================================================ */
let verdictTimer = null;
function showVerdict(good){
  const el = document.getElementById('verdict-pop');
  clearTimeout(verdictTimer);
  el.className = 'verdict-pop';
  void el.offsetWidth;            // restart animation
  el.textContent = good ? '✓' : '✕';
  el.className = 'verdict-pop show ' + (good ? 'good' : 'bad');
  verdictTimer = setTimeout(resetVerdict, 1600);
}
function resetVerdict(){
  clearTimeout(verdictTimer);
  const el = document.getElementById('verdict-pop');
  el.className = 'verdict-pop';
  el.textContent = '';
}

let confettiCanvas = null, confettiRAF = null;
function stopConfetti(){
  if(confettiRAF) cancelAnimationFrame(confettiRAF);
  confettiRAF = null;
  if(confettiCanvas){ confettiCanvas.remove(); confettiCanvas = null; }
}
function launchConfetti(){
  stopConfetti();
  if(reduceMotion) return;          // reduced motion: ✓ + green highlight only
  const cv = document.createElement('canvas');
  cv.className = 'confetti-canvas';
  document.body.appendChild(cv);
  confettiCanvas = cv;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const cols = ['#3B1781', '#6C3CD6', '#F4722B', '#14B3AC', '#FFC933', '#2FB56B', '#F0575A'];
  const parts = [];
  const sc = Math.max(0.7, Math.min(1.4, W / 1200));
  const burst = (x, y, ang, n) => {
    for(let i = 0; i < n; i++){
      const a = ang + (Math.random() - 0.5) * 0.9;
      const sp = (650 + Math.random() * 650) * sc;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: (7 + Math.random() * 7) * sc, h: (10 + Math.random() * 10) * sc,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
        c: cols[(Math.random() * cols.length) | 0], round: Math.random() < 0.25,
        wob: Math.random() * 6.28 });
    }
  };
  burst(0, H * 0.85, -Math.PI / 3, 90);
  burst(W, H * 0.85, -Math.PI * 2 / 3, 90);
  burst(W / 2, H * 0.95, -Math.PI / 2, 60);
  const life = 3.0;
  let start = null, last = null;
  const step = (ts) => {
    if(start === null){ start = ts; last = ts; }
    const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    const t = (ts - start) / 1000;
    ctx.clearRect(0, 0, W, H);
    const alpha = t > life - 0.7 ? Math.max(0, (life - t) / 0.7) : 1;
    ctx.globalAlpha = alpha;
    for(const p of parts){
      p.vy += 1300 * sc * dt;
      p.vx *= (1 - 1.6 * dt); p.vy *= (1 - 1.2 * dt);
      p.wob += 6 * dt;
      p.x += (p.vx + Math.sin(p.wob) * 40) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      if(p.round){ ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.283); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.wob)), p.w, p.h * Math.abs(Math.cos(p.wob)) + 1);
      ctx.restore();
    }
    if(t < life) confettiRAF = requestAnimationFrame(step);
    else stopConfetti();
  };
  confettiRAF = requestAnimationFrame(step);
}

/* ============================================================
   Wheel
   ============================================================ */
function polar(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function buildWheel(){
  const svg = document.getElementById('wheel-svg');
  if(svg.querySelector('path')) return; // wedges already present in static markup
  svg.innerHTML = "";
  for(let i=0;i<N;i++){
    const start = i * SEG_ANGLE;
    const end = start + SEG_ANGLE;
    const p1 = polar(CENTER, CENTER, RADIUS, start);
    const p2 = polar(CENTER, CENTER, RADIUS, end);
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    const d = `M ${CENTER},${CENTER} L ${p1.x.toFixed(2)},${p1.y.toFixed(2)} A ${RADIUS},${RADIUS} 0 0,1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z`;
    path.setAttribute("d", d);
    path.setAttribute("fill", COLORS[i % COLORS.length]);
    path.setAttribute("stroke", "#FFF8EC");
    path.setAttribute("stroke-width", "3");
    path.setAttribute("id", "wedge-" + i);
    svg.appendChild(path);

    const mid = start + SEG_ANGLE/2;
    const labelPos = polar(CENTER, CENTER, RADIUS*0.68, mid);
    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", labelPos.x);
    text.setAttribute("y", labelPos.y);
    text.setAttribute("id", "label-" + i);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("transform", `rotate(${mid}, ${labelPos.x}, ${labelPos.y})`);
    text.setAttribute("font-family", "Baloo 2, sans-serif");
    text.setAttribute("font-weight", "700");
    text.setAttribute("font-size", "28");
    text.setAttribute("fill", "#FFF8EC");
    text.textContent = (i+1);
    svg.appendChild(text);
  }
}

function refreshWedgeStates(){
  for(let i=0;i<N;i++){
    const wedge = document.getElementById("wedge-" + i);
    const label = document.getElementById("label-" + i);
    if(usedThisCycle.has(i)){
      wedge.setAttribute("fill", "#D9D2E8");
      label.setAttribute("fill", "#B7ADD0");
    } else {
      wedge.setAttribute("fill", COLORS[i % COLORS.length]);
      label.setAttribute("fill", "#FFF8EC");
    }
  }
}

function updateStatus(){
  document.getElementById('cycle-num').textContent = cycleNum;
  document.getElementById('remaining-num').textContent = N - usedThisCycle.size;
}

function showCycleBanner(){
  const b = document.getElementById('cycle-banner');
  b.classList.add('show');
  setTimeout(()=> b.classList.remove('show'), 2600);
}

function pickNextIndex(){
  let pool = [];
  for(let i=0;i<N;i++) if(!usedThisCycle.has(i)) pool.push(i);
  if(pool.length === 0){
    usedThisCycle.clear();
    cycleNum += 1;
    showCycleBanner();
    for(let i=0;i<N;i++) pool.push(i);
    refreshWedgeStates();
    updateStatus();
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function spinTo(index){
  const segCenter = index * SEG_ANGLE + SEG_ANGLE/2;
  const targetAbsolute = ((-segCenter) % 360 + 360) % 360;
  const currentMod = ((currentRotation % 360) + 360) % 360;
  let delta = (targetAbsolute - currentMod + 360) % 360;
  const extraSpins = 360 * EXTRA_SPINS;
  currentRotation = currentRotation + extraSpins + delta;
  const svg = document.getElementById('wheel-svg');
  svg.style.transform = `rotate(${currentRotation}deg)`;
}

// Resolves once the wheel has fully stopped (transitionend, with a timeout fallback).
function waitForSpinEnd(){
  return new Promise(resolve => {
    const svg = document.getElementById('wheel-svg');
    let done = false;
    const finish = () => {
      if(done) return; done = true;
      svg.removeEventListener('transitionend', onEnd);
      clearTimeout(fallback);
      resolve();
    };
    const onEnd = (e) => { if(e.target === svg && e.propertyName === 'transform') finish(); };
    svg.addEventListener('transitionend', onEnd);
    const fallback = setTimeout(finish, SPIN_DURATION_MS + 400);
  });
}

/* ============================================================
   Question modal
   ============================================================ */
function openQuestion(index){
  activeIndex = index;
  answered = false;
  stopConfetti();
  resetVerdict();
  const data = QUESTIONS[index];
  document.getElementById('q-badge').textContent = "SOALAN " + (index+1);
  document.getElementById('q-text').textContent = data.q;

  const opts = [...data.wrong.map(w => ({...w, correct:false})), {...data.correct, correct:true}];
  for(let i = opts.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }

  const optWrap = document.getElementById('options');
  optWrap.innerHTML = "";
  const entries = [];
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    const img = document.createElement('img');
    img.src = o.img; img.alt = o.alt; img.width = 112; img.height = 112; img.draggable = false;
    const span = document.createElement('span');
    span.className = 'opt-text';
    span.textContent = o.text;
    btn.append(img, span);
    const entry = { btn, correct: o.correct };
    entries.push(entry);
    btn.addEventListener('click', () => handleAnswer(entry, entries));
    optWrap.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.innerHTML = "";
  fb.className = "feedback";
  document.getElementById('next-btn').classList.remove('show');

  document.getElementById('overlay').classList.add('show');
  const card = document.querySelector('.card'); card.scrollTop = 0;
}

function handleAnswer(entry, entries){
  if(answered || entry.btn.disabled) return;   // ignore taps on a used option / after the correct answer
  unlockAudio();
  entry.btn.disabled = true;                   // each option can only be tried once
  const fb = document.getElementById('feedback');
  fb.innerHTML = "";
  fb.className = "feedback";
  const mark = document.createElement('span'); mark.className = 'mark'; mark.setAttribute('aria-hidden', 'true');
  const msg = document.createElement('span');
  if(entry.correct){
    answered = true;
    entries.forEach(e => { e.btn.disabled = true; if(e !== entry && !e.btn.classList.contains('wrong')) e.btn.classList.add('dim'); });
    entry.btn.classList.add('correct');
    mark.textContent = '✓';
    msg.textContent = "Betul! Syabas! 🎉";
    fb.classList.add('good');
    playCheer();
    showVerdict(true);
    launchConfetti();
    document.getElementById('next-btn').classList.add('show');
  } else {
    entry.btn.classList.add('wrong');          // stays red; the correct answer is NOT revealed
    mark.textContent = '✕';
    msg.textContent = "Belum tepat. Cuba lagi!";
    fb.classList.add('bad');
    playBuzzer();
    showVerdict(false);
  }
  fb.append(mark, msg);
  if(!usedThisCycle.has(activeIndex)){         // the question counts as used once it is attempted
    usedThisCycle.add(activeIndex);
    refreshWedgeStates();
    updateStatus();
  }
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  resetVerdict();
}

async function spin(){
  if(spinning || document.getElementById('overlay').classList.contains('show')) return;
  spinning = true;
  unlockAudio();                  // user gesture: allowed to start audio here
  const hub = document.getElementById('hub');
  hub.classList.add('spinning');
  hub.setAttribute('aria-disabled', 'true');
  const idx = pickNextIndex();
  spinTo(idx);
  await waitForSpinEnd();
  spinning = false;
  hub.classList.remove('spinning');
  hub.removeAttribute('aria-disabled');
  openQuestion(idx);
}

document.getElementById('hub').addEventListener('click', spin);
document.getElementById('hub').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); spin(); }
});

document.getElementById('close-x').addEventListener('click', closeModal);
document.getElementById('next-btn').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && document.getElementById('overlay').classList.contains('show')) closeModal();
});

document.getElementById('sound-btn').addEventListener('click', (e) => {
  soundOn = !soundOn;
  const b = e.currentTarget;
  b.setAttribute('aria-pressed', String(soundOn));
  b.textContent = soundOn ? '🔊 Bunyi: Hidup' : '🔇 Bunyi: Mati';
  if(soundOn) unlockAudio();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if(spinning) return;
  usedThisCycle.clear();
  cycleNum = 1;
  refreshWedgeStates();
  updateStatus();
});

buildWheel();
updateStatus();
</script>
