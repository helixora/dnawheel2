<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roda DNA — Kuiz Little Lab</title>
<style>
  :root{
    --purple: #3B1781;
    --purple-light: #6C3CD6;
    --orange: #F4722B;
    --teal: #14B3AC;
    --yellow: #FFC933;
    --cream: #FFF8EC;
    --ink: #241247;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: #F4F2EE;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 36px 24px 70px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 6px;
  }
  .brand img{
    width:64px;
    height:64px;
    object-fit:contain;
  }
  .brand-text{
    color: var(--ink);
  }
  .brand-text .eyebrow{
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--orange);
    font-weight: 800;
    margin: 0;
  }
  .brand-text h1{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-size: 1.9rem;
    color: var(--purple);
    margin: 0;
    line-height:1.1;
  }

  .subtitle{
    color: #6B6577;
    font-size: 1.05rem;
    text-align:center;
    max-width: 480px;
    margin: 8px 0 32px;
  }

  .stage{
    position:relative;
    width: min(70vw, 460px);
    aspect-ratio: 1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pointer{
    position:absolute;
    top:-14px;
    left:50%;
    transform: translateX(-50%);
    width:0; height:0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 28px solid var(--purple);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.18));
    z-index: 5;
  }

  .wheel-ring{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background: white;
    padding: 10px;
    box-shadow:
      0 0 0 1px #EAE6DD,
      0 18px 40px rgba(60,40,20,0.14);
  }

  #wheel-svg{
    width:100%;
    height:100%;
    display:block;
    transition: transform 3.6s cubic-bezier(.13,.83,.19,1);
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 25%;
    aspect-ratio: 1/1;
    border-radius:50%;
    background: radial-gradient(circle at 32% 28%, var(--purple-light), var(--purple) 70%);
    border: 5px solid white;
    box-shadow: 0 6px 14px rgba(0,0,0,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index: 4;
    user-select:none;
  }
  .hub span{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    color: white;
    font-weight: 700;
    font-size: clamp(0.85rem, 2.6vw, 1.15rem);
    text-align:center;
    letter-spacing:0.02em;
  }
  .hub.spinning{ cursor: not-allowed; opacity:0.9; }
  .hub:active:not(.spinning){ transform: translate(-50%,-50%) scale(0.96); }

  .status{
    margin-top: 26px;
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content:center;
  }
  .chip{
    background: white;
    border: 1px solid #E7E2D8;
    color: #4A4457;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(60,40,20,0.05);
  }
  .chip b{ color: var(--orange); font-weight:800; }

  .reset-link{
    margin-top: 16px;
    background:none;
    border:none;
    color: #9A93A8;
    font-size: 0.85rem;
    text-decoration: underline;
    cursor:pointer;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  .reset-link:hover{ color: var(--purple); }

  @media (min-width: 900px){
    body{ padding: 48px 24px 80px; }
    .brand-text h1{ font-size: 2.2rem; }
    .subtitle{ font-size: 1.15rem; }
    .stage{ width: min(46vw, 520px); }
  }

  /* Modal */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(40,32,20,0.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease;
    z-index: 20;
    padding: 0;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  @media (min-width: 640px){
    .overlay{ align-items:center; }
  }

  .card{
    background: white;
    width: 100%;
    max-width: 560px;
    border-radius: 26px 26px 0 0;
    padding: 30px 28px 32px;
    transform: translateY(30px);
    transition: transform 0.3s ease;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
    max-height: 88vh;
    overflow-y:auto;
  }
  @media (min-width: 640px){
    .card{ border-radius: 26px; transform: translateY(10px); }
  }
  .overlay.show .card{ transform: translateY(0); }

  .card-eyebrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 10px;
  }
  .q-badge{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    background: var(--orange);
    color:white;
    font-weight:700;
    font-size:0.78rem;
    padding: 5px 12px;
    border-radius: 999px;
  }
  .close-x{
    background:none;
    border:none;
    font-size:1.4rem;
    color: #B4AEC0;
    cursor:pointer;
    line-height:1;
    padding: 6px 8px;
  }

  .question{
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-size: 1.35rem;
    line-height:1.3;
    color: var(--purple);
    margin: 4px 0 22px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  .opt{
    text-align:left;
    border: 2px solid #EAE6DD;
    background: #FBFAF8;
    border-radius: 14px;
    padding: 16px 18px;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .opt:hover:not(:disabled){ border-color: var(--purple-light); }
  .opt:active:not(:disabled){ transform: scale(0.99); }
  .opt:disabled{ cursor:default; }

  .opt.correct{
    background: #E4F8EE;
    border-color: #2FB56B;
    color:#1E7A48;
  }
  .opt.wrong{
    background: #FCE9E7;
    border-color: #E24C3C;
    color:#B33324;
  }
  .opt.dim{ opacity: 0.55; }

  .feedback{
    margin-top: 16px;
    font-weight: 800;
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-size: 1.05rem;
  }
  .feedback.good{ color:#1E7A48; }
  .feedback.bad{ color:#B33324; }

  .next-btn{
    margin-top: 20px;
    width:100%;
    background: var(--purple);
    color: white;
    border:none;
    border-radius: 14px;
    padding: 17px;
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{ display:block; }
  .next-btn:active{ transform: scale(0.99); }

  .cycle-banner{
    position: fixed;
    top: 20px; left:50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--yellow);
    color: var(--purple);
    font-family:'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    opacity:0;
    transition: all 0.35s ease;
    z-index: 30;
    pointer-events:none;
    font-size:0.92rem;
    text-align:center;
  }
  .cycle-banner.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>

<script>
const QUESTIONS = [
  { q: "Apakah yang menentukan perbezaan antara manusia?", correct: "DNA", wrong: ["Warna kulit", "Nama keluarga", "Bahasa ibunda"] },
  { q: "Apa itu DNA?", correct: "Unit kewarisan", wrong: ["Sejenis protein", "Sumber tenaga sel", "Cecair dalam darah"] },
  { q: "Di manakah terletaknya DNA?", correct: "Di dalam nukleus/sel", wrong: ["Di dalam otot", "Di permukaan kulit", "Di dalam darah sahaja"] },
  { q: "Berapakah jumlah sel di dalam badan kita?", correct: "30–40 trillion", wrong: ["1–2 juta", "100 ribu", "500 bilion"] },
  { q: "Apakah pusat kawalan sel?", correct: "Nukleus", wrong: ["Mitokondria", "Membran sel", "Ribosom"] },
  { q: "Berapakah panjang DNA jika diregangkan?", correct: "2 meter", wrong: ["2 sentimeter", "20 meter", "200 meter"] },
  { q: "Berapa peratus persamaan kod DNA sesama manusia?", correct: "99.9%", wrong: ["50%", "75%", "90%"] },
  { q: "Berapakah kod DNA?", correct: "4", wrong: ["2", "20", "46"] },
  { q: "Namakan pasangan molekul DNA?", correct: "A dan T, G dan C", wrong: ["A dan G, T dan C", "C dan A, T dan G", "A dan C, T dan G"] }
];

const COLORS = ["#3B1781", "#F4722B", "#14B3AC", "#FFC933"];
const N = QUESTIONS.length;
const SEG_ANGLE = 360 / N;
const CENTER = 170;
const RADIUS = 160;

let usedThisCycle = new Set();
let cycleNum = 1;
let currentRotation = 0;
let spinning = false;
let activeIndex = null;

function polar(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function buildWheel(){
  const svg = document.getElementById('wheel-svg');
  if(svg.querySelector('path')) return; // wedges already present in static markup
  svg.innerHTML = "";
  for(let i=0;i<N;i++){
    const start = i * SEG_ANGLE;
    const end = start + SEG_ANGLE;
    const p1 = polar(CENTER, CENTER, RADIUS, start);
    const p2 = polar(CENTER, CENTER, RADIUS, end);
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    const d = `M ${CENTER},${CENTER} L ${p1.x.toFixed(2)},${p1.y.toFixed(2)} A ${RADIUS},${RADIUS} 0 0,1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z`;
    path.setAttribute("d", d);
    path.setAttribute("fill", COLORS[i % COLORS.length]);
    path.setAttribute("stroke", "#FFF8EC");
    path.setAttribute("stroke-width", "3");
    path.setAttribute("id", "wedge-" + i);
    svg.appendChild(path);

    const mid = start + SEG_ANGLE/2;
    const labelPos = polar(CENTER, CENTER, RADIUS*0.68, mid);
    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", labelPos.x);
    text.setAttribute("y", labelPos.y);
    text.setAttribute("id", "label-" + i);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("transform", `rotate(${mid}, ${labelPos.x}, ${labelPos.y})`);
    text.setAttribute("font-family", "Baloo 2, sans-serif");
    text.setAttribute("font-weight", "700");
    text.setAttribute("font-size", "22");
    text.setAttribute("fill", "#FFF8EC");
    text.textContent = (i+1);
    svg.appendChild(text);
  }
}

function refreshWedgeStates(){
  for(let i=0;i<N;i++){
    const wedge = document.getElementById("wedge-" + i);
    const label = document.getElementById("label-" + i);
    if(usedThisCycle.has(i)){
      wedge.setAttribute("fill", "#D9D2E8");
      label.setAttribute("fill", "#B7ADD0");
    } else {
      wedge.setAttribute("fill", COLORS[i % COLORS.length]);
      label.setAttribute("fill", "#FFF8EC");
    }
  }
}

function updateStatus(){
  document.getElementById('cycle-num').textContent = cycleNum;
  document.getElementById('remaining-num').textContent = N - usedThisCycle.size;
}

function showCycleBanner(){
  const b = document.getElementById('cycle-banner');
  b.classList.add('show');
  setTimeout(()=> b.classList.remove('show'), 2600);
}

function pickNextIndex(){
  let pool = [];
  for(let i=0;i<N;i++) if(!usedThisCycle.has(i)) pool.push(i);
  if(pool.length === 0){
    usedThisCycle.clear();
    cycleNum += 1;
    showCycleBanner();
    for(let i=0;i<N;i++) pool.push(i);
    refreshWedgeStates();
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function spinTo(index){
  const segCenter = index * SEG_ANGLE + SEG_ANGLE/2;
  const targetAbsolute = ((-segCenter) % 360 + 360) % 360;
  const currentMod = ((currentRotation % 360) + 360) % 360;
  let delta = (targetAbsolute - currentMod + 360) % 360;
  const extraSpins = 360 * 5;
  currentRotation = currentRotation + extraSpins + delta;
  const svg = document.getElementById('wheel-svg');
  svg.style.transform = `rotate(${currentRotation}deg)`;
}

function openQuestion(index){
  activeIndex = index;
  const data = QUESTIONS[index];
  document.getElementById('q-badge').textContent = "SOALAN " + (index+1);
  document.getElementById('q-text').textContent = data.q;

  const opts = [...data.wrong.map(w => ({text: w, correct:false})), {text: data.correct, correct:true}];
  for(let i = opts.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }

  const optWrap = document.getElementById('options');
  optWrap.innerHTML = "";
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = o.text;
    btn.addEventListener('click', () => handleAnswer(btn, o.correct, optWrap));
    optWrap.appendChild(btn);
  });

  document.getElementById('feedback').textContent = "";
  document.getElementById('feedback').className = "feedback";
  document.getElementById('next-btn').classList.remove('show');

  document.getElementById('overlay').classList.add('show');
}

function handleAnswer(btn, isCorrect, optWrap){
  const buttons = optWrap.querySelectorAll('.opt');
  buttons.forEach(b => { b.disabled = true; if(b !== btn) b.classList.add('dim'); });
  const feedback = document.getElementById('feedback');
  if(isCorrect){
    btn.classList.add('correct');
    feedback.textContent = "Betul! Syabas! 🎉";
    feedback.classList.add('good');
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => {
      const isThisCorrect = QUESTIONS[activeIndex].correct === b.textContent;
      if(isThisCorrect) b.classList.add('correct');
    });
    feedback.textContent = "Belum tepat. Jawapan yang betul telah ditunjukkan.";
    feedback.classList.add('bad');
  }
  usedThisCycle.add(activeIndex);
  refreshWedgeStates();
  updateStatus();
  document.getElementById('next-btn').classList.add('show');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('hub').addEventListener('click', () => {
  if(spinning) return;
  spinning = true;
  document.getElementById('hub').classList.add('spinning');
  const idx = pickNextIndex();
  spinTo(idx);
  setTimeout(() => {
    spinning = false;
    document.getElementById('hub').classList.remove('spinning');
    openQuestion(idx);
  }, 3700);
});

document.getElementById('close-x').addEventListener('click', closeModal);
document.getElementById('next-btn').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  usedThisCycle.clear();
  cycleNum = 1;
  refreshWedgeStates();
  updateStatus();
});

buildWheel();
updateStatus();
</script>
</body>
</html>
